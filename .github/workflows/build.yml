name: Native AOT
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - name: Run native headless scenario
        shell: bash
        run: |
          executable="artifacts/${{ matrix.rid }}/DoomSharp"
          if [[ "${{ runner.os }}" == "Windows" ]]; then executable="${executable}.exe"; fi
          "$executable" --demo --headless --frames 35 --output artifacts/demo.ppm
      - name: Exercise native desktop backend
        shell: bash
        run: |
          executable="artifacts/${{ matrix.rid }}/DoomSharp"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a "$executable" --demo --no-audio --frames 35 --output artifacts/desktop.ppm
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            "${executable}.exe" --demo --no-audio --frames 35 --output artifacts/desktop.ppm
          else
            "$executable" --demo --no-audio --frames 35 --output artifacts/desktop.ppm
          fi
      - name: Play native demo through OS input
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/native-demo.py artifacts/linux-x64/DoomSharp --output-dir artifacts/native-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doomsharp-${{ matrix.rid }}
          path: artifacts/
